# Renders profile stats to an SVG committed into this repo.
#
# Why this exists: every card served from github-readme-stats.vercel.app has
# failed on this profile — the stats card, top-languages and the trophy. That
# host sits permanently over GitHub's API quota, so no parameter tweak revives
# them. This runs on a schedule instead, commits the result, and the README
# points at a local file — so nothing is fetched from a third party when someone
# views the profile. It cannot rate-limit.
#
# SETUP (one step, only you can do it):
#   1. Create a classic PAT with the `repo` scope.
#      Giving it `repo` lets the language breakdown include PRIVATE repos —
#      which matters here, since ~56 of 62 repos are private and the old
#      top-langs card only ever saw the public handful.
#   2. Add it at Settings → Secrets and variables → Actions → New repository
#      secret, named METRICS_TOKEN.
#   3. Run it once from the Actions tab (workflow_dispatch), then uncomment the
#      ![Metrics](./github-metrics.svg) line in README.md.
#
# Note: this only runs once merged to the default branch.

name: Metrics

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    # METRICS_TOKEN lives in the "prod" environment, not in repository secrets.
    # Without this line the job cannot read it and the token arrives empty.
    environment: prod
    steps:
      - name: Render profile metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # Commit the SVG as you, not as github-actions[bot]. Without this the bot
          # is credited for each run and reappears in the repo's contributors list.
          committer_token: ${{ secrets.METRICS_TOKEN }}
          user: Mrvishal2k2
          filename: github-metrics.svg
          template: classic
          base: header, activity, repositories
          config_timezone: Asia/Kolkata   # adjust if wrong

          # The rendered canvas was 491px tall and the languages bar sat below that
          # edge, so the section looked empty when it had in fact rendered. Extra
          # vertical padding gives the canvas room. Raise the second value again if
          # anything is still cut off at the bottom.
          config_padding: 0, 20 + 20%

          # Replaces the broken top-languages card.
          # repositories_affiliations + a `repo`-scoped token means private work
          # counts toward the breakdown without exposing a single private repo.
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_details: percentage
          plugin_languages_colors: github

          # Achievements is off. It rendered "unexpected error" both before and
          # after read:org and read:user were added to the PAT, so the cause is not
          # scopes. The trophy card in README.md covers this instead.
          # plugin_achievements: yes
